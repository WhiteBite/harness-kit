# Docs: https://github.com/WhiteBite/repo-aeo/blob/main/docs/configuration.md

schema_version: 1   # config schema revision; rdk warns on any other value

project:
  name: "@whitebite/harness-kit"
  one_liner: "Canonical registry and zero-dependency primitives for wiring AI coding harnesses (Claude Code, Codex, OpenCode 1.x/2.x, Gemini, Qwen, Cursor, Windsurf, Kiro, Devin, Copilot, Crush, Cline, Aider): config paths, hook dialects, owner-scoped merges, skill symlinks, marker blocks."   # 1 sentence, shown as the GitHub description
  description: "Canonical registry and zero-dependency primitives for wiring AI coding harnesses (Claude Code, Codex, OpenCode 1.x/2.x, Gemini, Qwen, Cursor, Windsurf, Kiro, Devin, Copilot, Crush, Cline, Aider): config paths, hook dialects, owner-scoped merges, skill symlinks, marker blocks."
  category: "library"   # library | app | template | research | tool | dataset | mcp-server
  copyright_holder:   # name on the LICENSE copyright line; seeded from the git owner

audiences: []

use_cases: []   # 3-7 concrete jobs this project does

keywords:
  github_topics:
    - "open-source"
    - "developer-tools"
    - "library"
    - "whitebite"
    - "harness"
    - "kit"
    - "ai-harness"
    - "claude-code"
    - "codex-cli"
    - "opencode"
    - "gemini-cli"
    - "cursor"   # 8-20 terms, lowercase with hyphens
  npm_keywords:
    - "ai-harness"
    - "claude-code"
    - "codex-cli"
    - "opencode"
    - "gemini-cli"
    - "cursor"
    - "kiro"
    - "devin"
    - "copilot"
    - "hooks"
    - "agent-skills"
    - "installer"
    - "registry"
    - "zero-dependencies"
    - "open-source"   # 5-15 terms for package.json keywords

links:
  homepage: "https://github.com/WhiteBite/harness-kit"
  docs:
  demo:
  issues:

quickstart:
  prerequisites:
    - "Node.js >= 18"
  install: "npm install"
  run:
  test: "npm run test"

artifacts:
  has_npm_package: true
  has_docs_site: false

differentiators: []   # "why this repo, not the alternatives"

safety:
  allow_autofix: false          # lets the Action open autofix PRs
  require_ack_for_publish: true
  ack:   # optional override of the github-sync ACK string; empty keeps the default
